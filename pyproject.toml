[project]
name = "emotion-engine"
version = "1.0.0"
description = "Machine learning pipeline and desktop application predicting dominant human emotions from social media usage patterns."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Ahmad Serieh", email = "ahmadserieh.official@gmail.com" }
]
keywords = [
    "machine-learning",
    "emotion-recognition",
    "social-media-analytics",
    "scikit-learn",
    "random-forest",
    "classification",
    "behavioral-analytics",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "imbalanced-learn>=0.11.0",
    "joblib>=1.3.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
]

[project.scripts]
emotion-engine = "emotion_engine.cli:main"

[project.gui-scripts]
emotion-engine-gui = "emotion_engine.gui:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["notebooks", "docs_archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
